# Shearbolt's daily run of release.yml: its build and its scan, without the steps after the scan.
# `shearbolt setup` writes this file. Run it again after you change release.yml.
name: Shearbolt daily (release)
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      # `make release` runs the tests first
      - run: make release
      - name: shearbolt
        uses: klar-web-services/shearbolt@v1
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      - name: Build
        run: ./scripts/build-release.sh
      - name: shearbolt
        uses: klar-web-services/shearbolt@v1
