# Pipelines for the api service
image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 2048

pipelines:
  branches:
    main:
      - step:
          name: Build and push
          services:
            - docker
          caches:
            - docker
          script:
            - export IMAGE=registry.example.com/acme/api
            - echo "$REGISTRY_PASSWORD" | docker login registry.example.com -u "$REGISTRY_USER" --password-stdin
            - docker build -t $IMAGE:$BITBUCKET_COMMIT . && docker push $IMAGE:$BITBUCKET_COMMIT
  tags:
    'v*':
      - step:
          name: Release to ECR
          services:
            - docker
          script:
            - docker build -t api:$BITBUCKET_TAG .  # tag for the ECR pipe
            - pipe: atlassian/aws-ecr-push-image:2.4.2
              variables:
                IMAGE_NAME: api
                TAGS: $BITBUCKET_TAG
