name: ci
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh -n conf/check.sh || true
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      IMAGE: ghcr.io/acme/edge
    steps:
      - uses: actions/checkout@v5
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          live=$(docker pull -q "$IMAGE:latest" >/dev/null 2>&1 && docker inspect -f '{{ index .Config.Labels "rev" }}' "$IMAGE:latest" || true)
          if [ -n "$live" ] && git diff --quiet "$live" "$GITHUB_SHA" -- Dockerfile conf/; then
            echo "unchanged"
            exit 0
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            exit 0
          fi
          docker build --label "rev=$GITHUB_SHA" -t "$IMAGE:latest" -t "$IMAGE:sha-$GITHUB_SHA" .
          docker push -q "$IMAGE:latest"
          docker push -q "$IMAGE:sha-$GITHUB_SHA"
