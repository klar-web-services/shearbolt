name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          for t in amd64/x86_64-unknown-linux-gnu arm64/aarch64-unknown-linux-gnu; do
            goarch=${t%%/*}; triple=${t#*/}
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch go build -trimpath -o "build/$triple/tool" ./cmd/tool
            tar -czf "dist/tool-$triple.tar.gz" -C "build/$triple" tool
          done
      - uses: actions/upload-artifact@v5
        with:
          name: candidate
          path: dist/

  gate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: ${{ runner.temp }}/dist
      - name: Unpack the candidates
        run: |
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "$RUNNER_TEMP/candidate/$triple"
            tar -xzf "$RUNNER_TEMP/dist/tool-$triple.tar.gz" -C "$RUNNER_TEMP/candidate/$triple" tool
          done
      - name: Gate with Shearbolt
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          curl -fsSL "https://tools.klar.ws/shearbolt/v1.2.3/shearbolt-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/shearbolt.tar.gz"
          mkdir -p "$RUNNER_TEMP/gate"
          tar -xzf "$RUNNER_TEMP/shearbolt.tar.gz" -C "$RUNNER_TEMP/gate" shearbolt
          "$RUNNER_TEMP/gate/shearbolt" scan --ci --config .github/release-gate.yaml --output-dir "$RUNNER_TEMP/gate-evidence"

  publish:
    needs: [build, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz
