# Written by hand. CANDIDATE_DIR holds <triple>/tool for each build. Paths are relative to this file.
version: 1
project: tool-release
targets:
  - name: linux-amd64
    file: ${CANDIDATE_DIR}/x86_64-unknown-linux-gnu/tool
  - name: linux-arm64
    file: ${CANDIDATE_DIR}/aarch64-unknown-linux-gnu/tool
  - name: repo
    source: ..
    exclude: [testdata/]
