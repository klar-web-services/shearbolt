# Build the storefront image and ship it to GHCR.
name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/acme/storefront
          tags: |
            type=ref,event=branch
            type=sha
      # Cache layers in the GitHub cache; keep in sync with Dockerfile stages.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # PRs only build
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/acme/storefront:shearbolt-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: shearbolt
        uses: klar-web-services/shearbolt@v1
        env:
          SHEARBOLT_IMAGE: ghcr.io/acme/storefront:shearbolt-${{ github.sha }}
      - name: Push image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            docker push "$tag"
          done
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: curl -fsS -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
