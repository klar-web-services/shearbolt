# Shearbolt's daily run of deploy.yml: its build and its scan, without the steps after the scan.
# `shearbolt setup` writes this file. Run it again after you change deploy.yml.
name: Shearbolt daily (deploy)
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/acme/storefront
          tags: |
            type=ref,event=branch
            type=sha
      # Cache layers in the GitHub cache; keep in sync with Dockerfile stages.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # PRs only build
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/acme/storefront:shearbolt-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: shearbolt
        uses: klar-web-services/shearbolt@v1
        env:
          SHEARBOLT_IMAGE: ghcr.io/acme/storefront:shearbolt-${{ github.sha }}
