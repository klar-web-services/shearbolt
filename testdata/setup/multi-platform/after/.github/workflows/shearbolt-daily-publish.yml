# Shearbolt's daily run of publish.yml: its build and its scan, without the steps after the scan.
# `shearbolt setup` writes this file. Run it again after you change publish.yml.
name: Shearbolt daily (publish)
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: shearbolt
        uses: klar-web-services/shearbolt@v1
