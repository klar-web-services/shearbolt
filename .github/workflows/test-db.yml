name: test-db
# Builds the vulnerability-database snapshot that Shearbolt's own tests scan with (plan 3, D3) and
# stores it on the test-db pre-release. Manual only; see "Refreshing the snapshot" in
# testdata/README.md:
#
#   gh workflow run test-db.yml --ref main [-f date=YY-MM-DD]
#
# The database holds only the github, nvd, kev and epss providers. That is everything npm and Rust
# matching needs, and all four allow redistribution with attribution (testdata/db-snapshot-NOTICE.txt).
# Do not add providers without checking their licenses: some (wolfi, chainguard) forbid sharing
# derived copies, and others (alpine, ubuntu) are share-alike.
#
# grype-db runs only in `build`, which has contents: read. `store` holds the write token and runs
# no downloaded or repository code, only gh.
on:
  workflow_dispatch:
    inputs:
      date:
        description: Day of Anchore's provider data (YY-MM-DD, UTC). Empty means today.
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: test-db
  cancel-in-progress: false
defaults:
  run:
    shell: bash # bash -eo pipefail
env:
  # grype-db 0.54.7 is built against Grype 0.121.2, the version pinned in internal/grype/pins.go.
  # Move both together: a newer grype-db may write a schema the pinned Grype cannot read.
  GRYPE_DB_VERSION: 0.54.7
  GRYPE_DB_SHA256: eab1d002b4b5fdd3f7527b976e41815f0fc6b91ef4b70595ed878a3354e57462 # grype-db_0.54.7_linux_amd64.tar.gz
  PROVIDERS: github nvd kev epss
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Day of the provider data
        env:
          DATE: ${{ inputs.date }}
        run: |
          [ -n "$DATE" ] || DATE=$(date -u +%y-%m-%d)
          if ! printf '%s\n' "$DATE" | grep -Eqx '[0-9]{2}-[0-9]{2}-[0-9]{2}'; then
            echo "::error::date must be YY-MM-DD, as in Anchore's provider data tags"
            exit 1
          fi
          echo "DATE=$DATE" >> "$GITHUB_ENV"
      - name: Install grype-db
        run: |
          a="grype-db_${GRYPE_DB_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/anchore/grype-db/releases/download/v$GRYPE_DB_VERSION/$a" -o "$RUNNER_TEMP/$a"
          echo "$GRYPE_DB_SHA256  $RUNNER_TEMP/$a" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/work"
          tar -xzf "$RUNNER_TEMP/$a" -C "$RUNNER_TEMP/bin" grype-db
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Write the grype-db configuration
        working-directory: ${{ runner.temp }}/work
        run: |
          {
            echo 'provider:'
            echo '  root: data'
            echo '  vunnel:'
            echo '    generate-configs: false'
            echo '  configs:'
            for p in $PROVIDERS; do echo "    - name: $p"; done
            echo 'build:'
            echo '  dir: build'
            echo '  schema-version: 6'
          } > grype-db.yaml
          cat grype-db.yaml
      # Anchore publishes each provider's processed vunnel results daily as a public OCI artifact,
      # ghcr.io/anchore/grype-db/data/<provider>:<YY-MM-DD>, with one layer: a grype-db cache backup.
      - name: Download and restore the provider data
        working-directory: ${{ runner.temp }}/work
        run: |
          : > provenance.txt
          for p in $PROVIDERS; do
            repo="anchore/grype-db/data/$p"
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -er .token)
            if ! manifest=$(curl -fsS -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/$repo/manifests/$DATE"); then
              echo "::error::no $p provider data for $DATE (ghcr.io/$repo:$DATE)"
              exit 1
            fi
            digest=$(jq -er '.layers | if length == 1 then .[0].digest else error("expected one layer") end' <<<"$manifest")
            curl -fsSL -H "Authorization: Bearer $token" "https://ghcr.io/v2/$repo/blobs/$digest" -o "$p.tar.gz"
            echo "${digest#sha256:}  $p.tar.gz" | sha256sum -c -
            grype-db -c grype-db.yaml cache restore --path "$p.tar.gz" --delete-existing -p "$p"
            rm -f "$p.tar.gz"
            printf '  %-7s ghcr.io/%s:%s@%s\n' "$p" "$repo" "$DATE" "$digest" >> provenance.txt
          done
          grype-db -c grype-db.yaml cache status
      - name: Build and package the database
        id: package
        working-directory: ${{ runner.temp }}/work
        run: |
          grype-db -c grype-db.yaml build
          grype-db -c grype-db.yaml package
          shopt -s nullglob
          archives=(build/vulnerability-db_*.tar.zst)
          if [ "${#archives[@]}" != 1 ]; then
            echo "::error::expected exactly one packaged database, found ${#archives[@]}"
            exit 1
          fi
          name=${archives[0]##*/}
          # vulnerability-db_<schema>_<YYYY-MM-DD>T<hh:mm:ss>Z_<n>.tar.zst -> shearbolt-test-db-<schema>-<YYYYMMDD>T<hhmmss>Z.tar.zst
          d='[0-9]'
          asset=$(printf '%s\n' "$name" | sed -n "s/^vulnerability-db_\(v[0-9][0-9.]*\)_\($d$d$d$d\)-\($d$d\)-\($d$d\)T\($d$d\):\($d$d\):\($d$d\)Z_[0-9]*\.tar\.zst\$/shearbolt-test-db-\1-\2\3\4T\5\6\7Z.tar.zst/p")
          if [ -z "$asset" ]; then
            echo "::error::cannot derive an asset name from $name"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          mv "${archives[0]}" "$RUNNER_TEMP/out/$asset"
          sum=$(sha256sum "$RUNNER_TEMP/out/$asset" | awk '{print $1}')
          {
            cat "$GITHUB_WORKSPACE/testdata/db-snapshot-NOTICE.txt"
            echo
            echo 'This archive'
            echo '------------'
            echo
            echo "File:     $asset"
            echo "SHA-256:  $sum"
            echo "Built:    $(date -u +%FT%TZ), $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "grype-db: $GRYPE_DB_VERSION"
            echo 'Provider data (Anchore processed vunnel results):'
            cat provenance.txt
          } > "$RUNNER_TEMP/out/$asset.NOTICE.txt"
          printf '%s  %s\n' "$sum" "$asset" > "$RUNNER_TEMP/out/pin"
          ls -l "$RUNNER_TEMP/out"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: test-db
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  store:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to the test-db release
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: ${{ needs.build.outputs.asset }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-db
          path: out
      - name: Store on the test-db release
        run: |
          r="$GITHUB_REPOSITORY"
          if [ "$(gh release view test-db -R "$r" --json isPrerelease --jq .isPrerelease)" != true ]; then
            echo "::error::the test-db pre-release is missing; see D3 in the plan for how it was created"
            exit 1
          fi
          # Never replace an asset: old commits may pin it.
          if gh release view test-db -R "$r" --json assets --jq '.assets[].name' | grep -qxF -- "$ASSET"; then
            echo "::error::the test-db release already holds $ASSET; not replacing it"
            exit 1
          fi
          gh release upload test-db -R "$r" "out/$ASSET" "out/$ASSET.NOTICE.txt"
          gh release edit test-db -R "$r" --notes "Grype vulnerability databases for Shearbolt's own tests, pinned by testdata/db-snapshot.sha256. Each archive holds data from the GitHub Advisory Database (CC BY 4.0), NIST's NVD, CISA's KEV catalog (CC0) and FIRST's EPSS only. Its .NOTICE.txt lists the sources, terms, attributions and provider data it was built from."
          {
            echo "### Stored $ASSET"
            echo
            echo 'Pin it in `testdata/db-snapshot.sha256`, run the integration and behaviour tests on it, then commit:'
            echo
            echo '```'
            cat out/pin
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
